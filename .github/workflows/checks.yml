name: Windows build and offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows applications
        shell: pwsh
        run: ./src/build-windows.ps1
      - name: Core checks
        shell: pwsh
        run: dotnet run --project src/tests/DV.Core.Tests.csproj -c Release
      - name: Capture lifecycle checks
        shell: pwsh
        run: dotnet run --project src/ui-tests/DV.Ui.Lifecycle.Tests.csproj -c Release -- --work-root .artifacts/ui-lifecycle-tests
      - name: DirectShow offline checks
        shell: pwsh
        run: |
          $testDirectory = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          ./bin/directshow/dv-directshow.exe --self-test --self-test-dir $testDirectory
          if ($LASTEXITCODE -ne 0) { throw 'DirectShow checks failed' }
